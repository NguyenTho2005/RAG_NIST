[project]
name = "advanced-rag"
version = "0.1.0"
description = "Vietnamese-first multilingual RAG platform with traceable hybrid retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=5.3,<7",
  "numpy>=2.1,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.13,<1.14",
  "redis>=5.2,<7",
  "sentence-transformers>=3.3,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tiktoken>=0.8,<1",
  "torch>=2.5,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-beautifulsoup4>=4.12",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "apps/worker/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/worker"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires PostgreSQL and Qdrant",
  "e2e: full stack end-to-end",
  "security: security-focused checks",
  "slow: slow test",
  "llm: requires a configured LLM provider",
]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "apps/worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "C4", "DTZ", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "apps/api:apps/worker"
exclude = ["alembic/versions", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tiktoken.*", "pypdf.*", "docx.*", "arq.*", "qdrant_client.*", "sentence_transformers.*", "torch.*", "charset_normalizer.*"]
ignore_missing_imports = true
