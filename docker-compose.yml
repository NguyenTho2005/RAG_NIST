name: advanced-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev_password
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.11.3
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag_dev_password@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LLM_API_BASE: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /data
      INLINE_WORKER: "false"
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: ["python", "-m", "worker.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag_dev_password@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LLM_API_BASE: http://ollama:11434
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /data
      INLINE_WORKER: "false"
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollamadata:
  appdata:
